## Two-line boxed prompt -- generated by matugen, do not edit by hand.
## Edit ~/.config/matugen/templates/starship.toml instead.
## Docs: https://starship.rs/config/
##
## Colours are matugen roles, so the prompt re-themes with the wallpaper:
##   primary  = the accent (path, the prompt character)
##   tertiary = git state, so it reads as a different thing from the path
##   outline  = the frame and everything deliberately quiet
##   error    = read-only dirs, failed commands, root
## Starship takes hex directly in a style string, e.g. "bold #e4c1cf".
##
## The format strings carry Nerd Font glyphs (folder U+F07B, lock U+F023,
## clock U+F017, and the four directory substitutions). Edit this file with a
## real editor -- retyping those lines by hand silently drops them.

# Blank line between each prompt so things stay airy.
add_newline = true

# Only the modules listed here render, which is what keeps it monochrome —
# starship's colorful language/cloud modules are simply never drawn.
format = """
[╭─](#9a8e92)$username$hostname$directory$git_status$cmd_duration
[╰─](#9a8e92)$character"""

[directory]
# Path is the loudest thing on screen: bright white + bold.
format = "[  $path]($style)[$read_only]($read_only_style)"
style = "bold #e4c1cf"
# Truncation drops leading components, so the folder you're *in* is never hidden.
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = "  "
read_only_style = "#ffb4ab"

[directory.substitutions]
"Documents" = " Documents"
"Downloads" = " Downloads"
"Music" = " Music"
"Pictures" = " Pictures"

[git_status]
format = "([ $all_status$ahead_behind]($style))"
style = "#eac2b0"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "✚${count}"
staged = "●${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2000
format = "[  $duration]($style)"
style = "#9a8e92"

[character]
format = "$symbol "
success_symbol = "[❯](bold #e4c1cf)"
error_symbol = "[❯](bold #ffb4ab)"
vimcmd_symbol = "[❮](bold #d4c2c8)"

# Shown only over SSH, so local prompts stay clean.
[username]
format = "[$user]($style)[@](#9a8e92)"
style_user = "#9a8e92"
style_root = "bold #ffb4ab"
show_always = false

[hostname]
format = "[$hostname]($style) "
style = "#9a8e92"
ssh_only = true